<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images ReÃ§ues</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        h1 {
            background-color: #f8f9fa;
            padding: 20px;
            margin: 0;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
        }
        .gallery .image-container {
            margin: 10px;
            text-align: center;
        }
        .gallery img {
            max-width: 300px;
            border: 2px solid #ccc;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease-in-out;
        }
        .gallery img:hover {
            transform: scale(1.05);
            border-color: #007bff;
        }
        .battery-level {
            font-size: 14px;
            color: #555;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1>Images ReÃ§ues</h1>
    <div class="gallery">
        {% for image, battery in image_battery_info %}
        <div class="image-container">
            <a href="/images/{{ image }}" target="_blank">
                <img src="/images/{{ image }}" alt="{{ image }}">
            </a>
            <div class="battery-level">Niveau de batterie : {{ battery }}%</div>
        </div>
        {% endfor %}
    </div>
</body>
</html>
